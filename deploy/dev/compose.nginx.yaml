# Dev stack variant: nginx instead of the injector loads the PDF action.
# Add it after deploy/dev/compose.yaml (task dev:up-nginx, task e2e:run-nginx):
#
#   docker compose --env-file deploy/dev/versions.env \
#     -f deploy/compose/compose.yaml -f deploy/dev/compose.yaml \
#     -f deploy/dev/compose.nginx.yaml up -d --build --wait
#
# DEV ONLY. Paths are relative to deploy/compose/.

services:
  # Out of the default profile: it does not start and does not hold port 8090.
  injector:
    profiles: [injector]

  edge:
    image: ${NGINX_IMAGE:?set in deploy/dev/versions.env}
    volumes:
      - type: bind
        source: ../dev/nginx/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    networks: [frontend]
    ports:
      - "127.0.0.1:${OUTPRINT_INJECTOR_PORT:-8090}:8090"
    depends_on:
      outline:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/_edge/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
