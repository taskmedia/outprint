# DEV ONLY. A throwaway OIDC provider for the local development stack.
# The user and password below are fictional and published in the repository;
# never reuse them anywhere. The OIDC client secret comes from the environment
# (generated by `make dev` into an untracked file).
issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

telemetry:
  http: 0.0.0.0:5558

oauth2:
  skipApprovalScreen: true

enablePasswordDB: true

staticClients:
  - id: outline
    name: Outline (dev)
    secretEnv: OUTLINE_OIDC_CLIENT_SECRET
    redirectURIs:
      - http://localhost:8090/auth/oidc.callback

# Password: dev-only-password
staticPasswords:
  - email: sam@example.invalid
    hash: "$2a$10$dk7N9iSTJZmOmhArJx822Ok.9t7Rpoboly.wdkBcdVwtn/KhShQg6"
    username: sam
    userID: 8c1d2b6e-5f3a-4c7e-9a10-2d3e4f5a6b7c
