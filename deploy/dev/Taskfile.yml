# https://taskfile.dev
#
# Development stack (docs/internals/development.md): Outline with login, the injector,
# Gateway and Worker, seeded with a fictional user, a bound and an unbound
# Collection. DEV ONLY. Included by the root Taskfile as `dev:`; tasks run in
# the repository root.
version: '3.54'

vars:
  # DEV_EDGE=nginx puts nginx in front of Outline instead of the injector
  # (docs/deploy/components/reverse-proxy-recipes.md).
  DEV_EDGE: '{{.DEV_EDGE | default ""}}'
  DEV_URL: '{{.DEV_URL | default "http://localhost:8090"}}'
  DEV_COMPOSE: docker compose --env-file deploy/dev/versions.env -f deploy/compose/compose.yaml -f deploy/dev/compose.yaml{{if eq .DEV_EDGE "nginx"}} -f deploy/dev/compose.nginx.yaml{{end}}

tasks:
  default:
    desc: Start the dev stack and seed it (up + seed)
    cmds:
      - task: up
      - task: seed

  secrets:
    desc: Generate the dev secrets, once
    sources:
      - deploy/dev/gen-secrets.sh
    generates:
      - deploy/dev/.generated/outline.env
      - deploy/dev/.generated/dex.env
    cmds:
      - ./deploy/dev/gen-secrets.sh

  up:
    desc: Build and start the dev stack (generates the secrets first)
    deps: [secrets]
    cmds:
      - '{{.DEV_COMPOSE}} up -d --build --wait'

  seed:
    desc: Seed the running stack; the one implementation, shared with the browser tests. Safe to rerun
    cmds:
      - go run ./cmd/seed -url {{.DEV_URL}}

  down:
    desc: Stop the stack, keep the database and files
    cmds:
      - '{{.DEV_COMPOSE}} down --remove-orphans'

  down-volumes:
    desc: Stop the stack and delete the database and files (the next `task dev` starts empty)
    cmds:
      - '{{.DEV_COMPOSE}} down --remove-orphans --volumes'

  logs:
    desc: Follow the logs of all services
    cmds:
      - '{{.DEV_COMPOSE}} logs -f --tail=100'

  clean:
    desc: Forget the generated dev secrets and the seed output
    summary: |
      Stop the stack with volumes first (dev:down-volumes), or Outline will
      not accept the new keys.
    cmds:
      - rm -rf deploy/dev/.generated
