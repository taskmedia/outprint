# Edge proxy for the dev stack that loads the PDF action without the injector
# (docs/deploy/components/reverse-proxy-recipes.md). DEV ONLY.
#
# It does the two things the injector does: it routes /pdf/* to the Gateway
# with the prefix removed, and it adds the bare tag to Outline's HTML pages.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# A navigation asks for HTML. For those, ask Outline for uncompressed HTML
# (sub_filter cannot read gzip) and drop the conditional headers, so a 304
# never serves a page that was cached without the tag.
map $http_accept $navigation {
    default      0;
    "~*text/html" 1;
}
map $navigation $upstream_accept_encoding {
    0 $http_accept_encoding;
    1 "identity";
}
map $navigation $upstream_if_none_match {
    0 $http_if_none_match;
    1 "";
}
map $navigation $upstream_if_modified_since {
    0 $http_if_modified_since;
    1 "";
}

server {
    listen 8090;
    server_name _;

    # A render may wait in the Gateway's queue.
    proxy_read_timeout 5m;

    location /pdf/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://gateway:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_edge/healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://outline:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding $upstream_accept_encoding;
        proxy_set_header If-None-Match $upstream_if_none_match;
        proxy_set_header If-Modified-Since $upstream_if_modified_since;

        # Only text/html (the default type list) is rewritten; JSON, scripts,
        # images, event streams and WebSocket frames pass untouched.
        sub_filter '</body>' '<script src="/pdf/button.js" defer></script></body>';
        sub_filter_once on;
    }
}
