# Edge proxy for the dev stack that only routes (docs/deploy/components/mounted-template.md).
# DEV ONLY.
#
# It does not touch a page: the script tag is already in the template that is
# mounted into Outline. What is left for the edge is the route of /pdf/* to the
# Gateway, with the prefix removed, and passing everything else to Outline.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 8090;
    server_name _;

    # A render may wait in the Gateway's queue.
    proxy_read_timeout 5m;

    location /pdf/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://gateway:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_edge/healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://outline:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
