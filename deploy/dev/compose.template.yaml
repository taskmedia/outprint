# Dev stack variant: the PDF action is loaded by a patched copy of Outline's page
# template, mounted into the Outline container (no injector, no HTML rewriting).
# nginx in front only routes /pdf/* to the Gateway.
# Add it after deploy/dev/compose.yaml (task dev:up DEV_EDGE=template,
# task e2e:run-template). The patched file comes from `task dev:template`.
#
# DEV ONLY. Paths are relative to deploy/compose/.

services:
  injector:
    profiles: [injector]

  outline:
    volumes:
      - type: bind
        source: ../dev/.generated/outline-index.html
        target: /opt/outline/build/app/index.html
        read_only: true

  edge:
    image: ${NGINX_IMAGE:?set in deploy/dev/versions.env}
    volumes:
      - type: bind
        source: ../dev/nginx/routing.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    networks: [frontend]
    ports:
      - "127.0.0.1:${OUTPRINT_INJECTOR_PORT:-8090}:8090"
    depends_on:
      outline:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/_edge/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
