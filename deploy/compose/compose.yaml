# Gateway and Worker from one image (docs/deploy/docker-compose.md, ADR 0001).
#
#   OUTLINE_URL=https://wiki.example.test docker compose \
#     -f deploy/compose/compose.yaml up --build
#
# The worker service block is the shipped Worker baseline. Security tests
# read it (see docs/deploy/docker-compose.md): weaken it and the build breaks.

name: outprint

x-outprint-image: &outprint-image
  image: outprint
  build:
    context: ../..
    dockerfile: Dockerfile

services:
  worker:
    <<: *outprint-image
    command: ["worker"]
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
      # No seccomp entry: Docker's default profile (RuntimeDefault) applies.
      # Never set seccomp:unconfined here.
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m,uid=10001,gid=10001
      - /work:mode=0700,size=256m,uid=10001,gid=10001
    environment:
      OUTPRINT_LISTEN: ":8081"
      OUTPRINT_WORK_DIR: /work
      # The one optional secret: a token shared with the gateway. Set the same
      # value in the environment of both services; empty means no token.
      OUTPRINT_WORKER_TOKEN: ${OUTPRINT_WORKER_TOKEN:-}
    volumes:
      - type: bind
        source: ../../templates
        target: /opt/outprint/templates
        read_only: true
      - type: bind
        source: ../../configurations
        target: /opt/outprint/configurations
        read_only: true
    networks: [worker-net]
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
    restart: always
    healthcheck:
      test: ["CMD", "outprint", "healthcheck", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  gateway:
    <<: *outprint-image
    command: ["gateway"]
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    environment:
      OUTPRINT_LISTEN: ":8080"
      OUTPRINT_WORKER_URL: http://worker:8081
      OUTPRINT_WORKER_TOKEN: ${OUTPRINT_WORKER_TOKEN:-}
      # Required: the base URL of your Outline. The gateway refuses to start
      # without it.
      OUTLINE_URL: ${OUTLINE_URL:-}
      # Admission control (docs/deploy/limits-and-admission.md). Empty keeps the service
      # configuration's value. Scale the slots with the Worker replicas.
      OUTPRINT_ADMISSION_SLOTS: ${OUTPRINT_ADMISSION_SLOTS:-}
      OUTPRINT_ADMISSION_QUEUE_DEPTH: ${OUTPRINT_ADMISSION_QUEUE_DEPTH:-}
      OUTPRINT_ADMISSION_PER_USER: ${OUTPRINT_ADMISSION_PER_USER:-}
      OUTPRINT_ADMISSION_MAX_WAIT: ${OUTPRINT_ADMISSION_MAX_WAIT:-}
    volumes:
      - type: bind
        source: ../../templates
        target: /opt/outprint/templates
        read_only: true
      - type: bind
        source: ../../configurations
        target: /opt/outprint/configurations
        read_only: true
    networks: [worker-net, frontend]
    ports:
      - "${OUTPRINT_PORT:-8080}:8080"
    depends_on:
      worker:
        condition: service_healthy
    mem_limit: 256m
    cpus: 1
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "outprint", "healthcheck", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # The injector sits in front of Outline (docs/deploy/injector.md). It is a
  # separate, slim image without the TeX toolchain and is not part of the
  # Worker baseline.
  injector:
    image: outprint-injector
    build:
      context: ../..
      dockerfile: Dockerfile
      target: injector
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    environment:
      OUTPRINT_INJECTOR_LISTEN: ":8090"
      # Required: where the injector reaches Outline (an internal address).
      OUTPRINT_INJECTOR_UPSTREAM: ${OUTPRINT_INJECTOR_UPSTREAM:-}
      # Requests below /pdf go to the Gateway, so the browser stays on one
      # origin and sends Outline's cookie by itself.
      OUTPRINT_INJECTOR_GATEWAY_URL: http://gateway:8080
      OUTPRINT_INJECTOR_GATEWAY_PREFIX: /pdf
      OUTPRINT_INJECTOR_CSP_ALLOW_SELF: ${OUTPRINT_INJECTOR_CSP_ALLOW_SELF:-false}
    networks: [frontend]
    ports:
      - "${OUTPRINT_INJECTOR_PORT:-8090}:8090"
    depends_on:
      gateway:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/outprint-injector", "healthcheck", "http://127.0.0.1:8090/_injector/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  # No route out: the Worker cannot reach the internet, Outline or the host.
  worker-net:
    internal: true
  frontend: {}
