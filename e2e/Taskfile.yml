# https://taskfile.dev
#
# Tier 3: browser end-to-end tests against the dev stack. Needs Docker, Go and
# Node. Included by the root Taskfile as `e2e:`; tasks run in e2e/.
version: '3.54'

tasks:
  install:
    desc: Install the e2e dependencies and the Playwright Chromium
    sources:
      - package-lock.json
    generates:
      - node_modules/.package-lock.json
    cmds:
      - npm ci
      - npx playwright install chromium

  run:
    desc: "Tier 3: browser tests against the dev stack (starts and seeds it)"
    summary: |
      Starts the stack when it is not running, seeds it, then runs the
      Playwright tests. Needs Docker, Go and Node.
    cmds:
      - task: :dev:up
      - task: :dev:seed
      - npx playwright test

  run-nginx:
    desc: "Tier 3: the same browser tests with nginx instead of the injector"
    summary: |
      Loads the PDF action through the nginx recipe of
      docs/deploy/components/reverse-proxy-recipes.md. Stop a running injector
      stack first (task dev:down), they share port 8090.
    cmds:
      - task: :dev:up
        vars: {DEV_EDGE: nginx}
      - task: :dev:seed
      - npx playwright test

  screenshots:
    desc: Regenerate the documentation screenshots in docs/assets/screens (needs `task dev`)
    summary: |
      Drives the seeded dev stack with Playwright (its own config, never part
      of `run`) and writes the optimised PNGs to docs/assets/screens/. The
      stack must be up (`task dev`); the seed is rerun first, which is safe.
      The example letter needs pdftoppm (poppler) or Docker. Also available
      as `task screenshots`.
    vars:
      DEV_URL: '{{.DEV_URL | default "http://localhost:8090"}}'
    preconditions:
      - sh: curl -fsS -o /dev/null --max-time 5 {{.DEV_URL}}/pdf/button.js
        msg: "the dev stack is not answering at {{.DEV_URL}}; run `task dev` first"
    cmds:
      - task: :dev:seed
      - task: install
      - npx playwright test -c playwright.screenshots.config.ts
      - node screenshots/optimize.mjs
