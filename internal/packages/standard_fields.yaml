# Standard Fields: documented common field names that Templates are
# encouraged to reuse so Template Configurations stay portable. Each name
# lists the types a Template may declare it with; declaring another type
# makes `outprint validate` warn. The prose version is docs/standard-fields.md.
common:
  title: [string]
  date: [date]
  language: [string]
  author: [string]
configuration:
  name: [string]
  logo: [asset]
  accent_color: [color]
  font: [string]
document_types:
  letter:
    recipient: [list, text]
    sender: [string, text, list]
    subject: [string]
    opening: [string]
    closing: [string]
    reference: [string]
    enclosures: [list]
    cc: [list]
  report:
    subtitle: [string]
    version: [string]
    abstract: [text]
    toc: [bool]
