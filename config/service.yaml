# Service configuration shipped in the image. The roots can be overridden
# with OUTPRINT_TEMPLATES_ROOT and OUTPRINT_CONFIGURATIONS_ROOT; the
# allow-list names the only Template and Configuration pairings that may be
# bound to a Collection.
templatesRoot: /opt/outprint/templates
configurationsRoot: /opt/outprint/configurations

bindings:
  - template: neutral
    configuration: example

defaultBinding:
  template: neutral
  configuration: example

# Hosts besides the Outline origin that an image redirect may lead to, for
# example the file storage behind Outline's attachments. Empty by default:
# only the Outline origin is allowed. A host name matches ports 80 and 443;
# write host:port for another port. See docs/images.md.
# imageHosts:
#   - files.example.invalid

# Admission control of the Gateway (docs/limits.md). One Worker runs one job,
# so keep slots equal to the number of Worker replicas. Every key is optional;
# the values below are the defaults. Environment variables override the file:
# OUTPRINT_ADMISSION_SLOTS, _QUEUE_DEPTH, _PER_USER and _MAX_WAIT.
# admission:
#   slots: 1        # renders at the same time
#   queueDepth: 4   # requests that may wait for a slot; 0 = none wait
#   perUser: 1      # renders per Outline user, queued and running together
#   maxWait: 60s    # how long a queued request waits before it gets a 429
