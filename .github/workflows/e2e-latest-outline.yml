name: e2e against latest outline

# Weekly, and non-blocking: the same browser tests, with the newest stable
# Outline release instead of the pinned one. A failure opens (or updates) an
# issue; it never blocks a pull request. Not required by any branch rule.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  latest:
    name: e2e with the latest Outline release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: install poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: newest stable Outline release
        id: outline
        run: |
          set -euo pipefail
          tag="$(gh api repos/outline/outline/releases/latest --jq .tag_name)"
          version="${tag#v}"
          # The image tag must exist; the release can be ahead of the registry.
          docker manifest inspect "outlinewiki/outline:${version}" > /dev/null
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Testing outlinewiki/outline:${version}" >> "$GITHUB_STEP_SUMMARY"

      - name: install the browser
        run: cd e2e && npm ci && npx playwright install --with-deps chromium

      # The shell variable wins over deploy/dev/versions.env.
      - name: seeded stack and tests
        id: e2e
        continue-on-error: true
        run: task e2e:run
        env:
          CI: "true"
          OUTLINE_IMAGE: outlinewiki/outline:${{ steps.outline.outputs.version }}

      - name: compose logs
        if: steps.e2e.outcome == 'failure'
        run: |
          OUTLINE_IMAGE="outlinewiki/outline:${{ steps.outline.outputs.version }}" \
          docker compose --env-file deploy/dev/versions.env \
            -f deploy/compose/compose.yaml -f deploy/dev/compose.yaml logs --no-color > compose-logs.txt || true

      - name: upload the report, traces and logs
        if: steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-latest-outline-failure
          path: |
            e2e/playwright-report
            e2e/test-results
            compose-logs.txt
          if-no-files-found: warn
          retention-days: 14

      - name: open or update the issue
        if: steps.e2e.outcome == 'failure'
        env:
          VERSION: ${{ steps.outline.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="E2E against latest Outline failed"
          body="The weekly browser E2E run against Outline ${VERSION} failed.

          Run: ${RUN_URL}

          The pinned version in deploy/dev/versions.env is unaffected. Open the run for the Playwright report and the compose logs."
          existing="$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi
