name: security

# Branch pushes are covered by the pull request run; only main runs on push.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# To restrict this workflow if the suite grows past about three minutes, see
# "Cadence decision" in docs/testing.md. The filter would be:
#
#   push:
#     branches: [main]
#     paths: [internal/worker/**, internal/workerserver/**, internal/limits/**,
#             internal/sandbox/**, cmd/**, deploy/**, Dockerfile, templates/**]
#   pull_request:
#     paths: [same as above]
#   schedule:
#     - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  security:
    # Mark this check as required in the branch protection rule of main.
    name: security (layers 1-3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/docker-cache

      - name: Test the skip guard
        run: task test-guard

      # Layer 1 in the golden image, layers 2 and 3 against the shipped
      # Compose flags. Test output goes to .security-logs/.
      - name: Security layers 1-3
        run: task test-security GOTEST_FLAGS=-json

      # A skipped security test counts as a failure.
      - name: Fail on skipped or missing tests
        if: always()
        run: ./scripts/security-guard.sh .security-logs/layer1.log .security-logs/sandbox.log

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-logs
          path: .security-logs/
