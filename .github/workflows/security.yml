name: security

on:
  push:
  pull_request:

# To restrict this workflow if the suite grows past about three minutes, see
# "Cadence decision" in docs/testing.md. The filter would be:
#
#   push:
#     branches: [main]
#     paths: [internal/worker/**, internal/workerserver/**, internal/limits/**,
#             internal/sandbox/**, cmd/**, deploy/**, Dockerfile, templates/**]
#   pull_request:
#     paths: [same as above]
#   schedule:
#     - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  security:
    # Mark this check as required in the branch protection rule of main.
    name: security (layers 1-3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test the skip guard
        run: make test-guard

      # Layer 1 in the golden image, layers 2 and 3 against the shipped
      # Compose flags. Test output goes to .security-logs/.
      - name: Security layers 1-3
        run: make test-security GOTEST_FLAGS=-json

      # A skipped security test counts as a failure.
      - name: Fail on skipped or missing tests
        if: always()
        run: ./scripts/security-guard.sh .security-logs/layer1.log .security-logs/sandbox.log

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-logs
          path: .security-logs/
