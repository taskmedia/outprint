name: e2e

# Tier 3: Playwright against the seeded dev stack (docs/development.md).
# Always on main and on demand; on pull requests only where the change can
# affect the browser flow.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - cmd/injector/**
      - cmd/seed/**
      - internal/inject/**
      - internal/outline/**
      - internal/gateway/**
      - internal/devseed/**
      - web/**
      - deploy/**
      - e2e/**
      - Dockerfile
      - Makefile
      - config/**
      - .github/workflows/e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: browser e2e (tier 3)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # The tests read the PDF text with pdftotext; without it they fall back
      # to pdfjs, which is the weaker check.
      - name: install poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: install the browser
        run: cd e2e && npm ci && npx playwright install --with-deps chromium

      - name: seeded stack and tests
        run: make e2e
        env:
          CI: "true"

      - name: compose logs
        if: failure()
        run: |
          docker compose --env-file deploy/dev/versions.env \
            -f deploy/compose/compose.yaml -f deploy/dev/compose.yaml logs --no-color > compose-logs.txt || true

      - name: upload the report, traces and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            e2e/playwright-report
            e2e/test-results
            compose-logs.txt
          if-no-files-found: warn
          retention-days: 14
