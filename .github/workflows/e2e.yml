name: e2e

# Tier 3: Playwright against the seeded dev stack (docs/internals/development.md).
# Always on main and on demand; on pull requests only where the change can
# affect the browser flow.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - cmd/outprint-injector/**
      - cmd/seed/**
      - internal/inject/**
      - internal/outline/**
      - internal/gateway/**
      - internal/devseed/**
      - web/**
      - deploy/**
      - e2e/**
      - docs/assets/screens/**
      - Dockerfile
      - Taskfile.yml
      - "**/Taskfile.yml"
      - config/**
      - .github/workflows/e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: browser e2e (tier 3)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # The tests read the PDF text with pdftotext; without it they fall back
      # to pdfjs, which is the weaker check.
      - name: install poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: install the browser
        run: cd e2e && npm ci && npx playwright install --with-deps chromium

      - name: seeded stack and tests
        run: task e2e:run
        env:
          CI: "true"

      # Visual check of the documentation screenshots on the stack that is
      # already up. Informational: the committed PNGs come from a developer
      # machine, so runner fonts may render slightly differently. The step can
      # never fail the job; the changed images go to the job summary and the
      # screenshots-changed artifact.
      - name: documentation screenshots (visual check)
        continue-on-error: true
        run: task screenshots
        env:
          CI: "true"
          SCREENSHOTS_DIFF_DIR: ${{ github.workspace }}/screenshot-diff

      - name: upload the changed screenshots
        if: hashFiles('screenshot-diff/*') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots-changed
          path: screenshot-diff
          retention-days: 14

      - name: compose logs
        if: failure()
        run: |
          docker compose --env-file deploy/dev/versions.env \
            -f deploy/compose/compose.yaml -f deploy/dev/compose.yaml logs --no-color > compose-logs.txt || true

      - name: upload the report, traces and logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-failure
          path: |
            e2e/playwright-report
            e2e/test-results
            compose-logs.txt
          if-no-files-found: warn
          retention-days: 14

  # The same tests with nginx instead of the injector: the recipe in
  # docs/internals/edge-proxy-recipes.md.
  e2e-nginx:
    name: browser e2e, nginx recipe
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: install poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: install the browser
        run: cd e2e && npm ci && npx playwright install --with-deps chromium

      - name: seeded stack and tests
        run: task e2e:run-nginx
        env:
          CI: "true"
          DEV_EDGE: nginx

      - name: compose logs
        if: failure()
        run: |
          docker compose --env-file deploy/dev/versions.env \
            -f deploy/compose/compose.yaml -f deploy/dev/compose.yaml \
            -f deploy/dev/compose.nginx.yaml logs --no-color > compose-logs.txt || true

      - name: upload the report, traces and logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-nginx-failure
          path: |
            e2e/playwright-report
            e2e/test-results
            compose-logs.txt
          if-no-files-found: warn
          retention-days: 14

  # The same tests against the oldest Outline the placement is supported on
  # (OUTLINE_OLDEST_IMAGE in deploy/dev/versions.env). Skipped while it equals
  # the pinned version, which the job above already covers.
  e2e-oldest:
    name: browser e2e, oldest supported Outline
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: oldest supported Outline
        id: oldest
        run: |
          set -euo pipefail
          set -a; . deploy/dev/versions.env; set +a
          if [ "${OUTLINE_OLDEST_IMAGE}" = "${OUTLINE_IMAGE}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "The oldest supported Outline is the pinned one (${OUTLINE_IMAGE}); nothing more to test." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "image=${OUTLINE_OLDEST_IMAGE}" >> "$GITHUB_OUTPUT"
            echo "Testing ${OUTLINE_OLDEST_IMAGE}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.oldest.outputs.run == 'true'
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.oldest.outputs.run == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - if: steps.oldest.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - if: steps.oldest.outputs.run == 'true'
        name: install poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - if: steps.oldest.outputs.run == 'true'
        name: install the browser
        run: cd e2e && npm ci && npx playwright install --with-deps chromium

      # The shell variable wins over deploy/dev/versions.env.
      - if: steps.oldest.outputs.run == 'true'
        name: seeded stack and tests
        run: task e2e:run
        env:
          CI: "true"
          OUTLINE_IMAGE: ${{ steps.oldest.outputs.image }}

      - if: failure() && steps.oldest.outputs.run == 'true'
        name: upload the report and traces
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-oldest-failure
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: warn
          retention-days: 14
