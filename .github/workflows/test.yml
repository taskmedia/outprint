name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit tests (tier 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: make test

  golden:
    name: goldens (tier 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails if the goldens differ or a tool is missing; never skipped.
      - run: make test-golden
