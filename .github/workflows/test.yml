name: test

# Branch pushes are covered by the pull request run; only main runs on push.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: unit tests (tier 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The button script tests run on Node's built-in test runner.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: task test

      - name: skip guard
        run: task test-guard

      - name: helm chart bump script
        run: task test-helm-bump

      - name: compose file is valid
        run: docker compose -f deploy/compose/compose.yaml config --quiet

      - name: dev compose stack is valid
        run: |
          ./deploy/dev/gen-secrets.sh
          docker compose --env-file deploy/dev/versions.env \
            -f deploy/compose/compose.yaml -f deploy/dev/compose.yaml config --quiet

  injector:
    name: injector image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: injector unit tests
        run: go test -race -count=1 -cover ./internal/inject/...

      - name: build the slim image
        run: task image-injector

      # The image has no shell, so the check runs from the outside.
      - name: image runs as non-root, has no TeX, and answers
        run: |
          set -euo pipefail
          test "$(docker image inspect -f '{{.Config.User}}' outprint-injector)" = "65532:65532"
          if docker run --rm --entrypoint /usr/bin/lualatex outprint-injector 2>/dev/null; then
            echo "injector image contains a TeX toolchain" >&2; exit 1
          fi
          id=$(docker run -d -p 8090:8090 -e OUTPRINT_INJECTOR_UPSTREAM=http://outline.example.invalid:3000 outprint-injector)
          trap 'docker rm -f "$id" >/dev/null' EXIT
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8090/_injector/healthz && exit 0
            sleep 0.5
          done
          docker logs "$id" >&2
          exit 1

  golden:
    name: goldens (tier 2) and security layer 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/docker-cache

      # Runs the PDF goldens, the Worker tests and the security layer 1
      # corpus in the pinned image. Fails if a golden differs or a tool is
      # missing; nothing here is ever skipped.
      - run: task test-golden
