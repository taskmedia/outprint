name: release

# One workflow does the whole release (docs/releasing.md):
#   1. release-please keeps a release PR up to date from the Conventional
#      Commits on main. Merging that PR creates the tag and the GitHub release.
#   2. The publish jobs below run in the same workflow run and build the images
#      from that tag. They cannot be a separate "on: push: tags" workflow:
#      tags and releases created with the default GITHUB_TOKEN do not trigger
#      other workflows.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: release PR and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          # A token from a user (secret PAT) makes the release PR
          # trigger the normal checks; the default GITHUB_TOKEN does not.
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Deploys the docs site for a new minor release (docs/releasing.md): the new
  # tag becomes a version of the site. It needs only release-please, not the
  # image jobs: a failing image build neither stops it nor is stopped by it.
  # Patch releases (X.Y.Z, Z > 0) and pre-releases (a version with a "-"
  # suffix such as 0.2.0-rc.1) are no site version; the final X.Y.0 is. The
  # push to main that merges the release pull request touches no docs file, so
  # docs.yml would not start on its own.
  docs:
    name: docs
    needs: release-please
    if: >-
      needs.release-please.outputs.release_created == 'true'
      && needs.release-please.outputs.patch == '0'
      && !contains(needs.release-please.outputs.version, '-')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    secrets: inherit

  build:
    name: build ${{ matrix.image }} (${{ matrix.platform }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # Each architecture builds on its own native runner. The TeX Live layer and
    # the font cache warm-up (lualatex) are slow and fragile under QEMU.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: outprint, target: outprint, platform: linux/amd64, runner: ubuntu-24.04 }
          - { image: outprint, target: outprint, platform: linux/arm64, runner: ubuntu-24.04-arm }
          - { image: outprint-injector, target: injector, platform: linux/amd64, runner: ubuntu-24.04 }
          - { image: outprint-injector, target: injector, platform: linux/arm64, runner: ubuntu-24.04-arm }
    env:
      REGISTRY_IMAGE: ghcr.io/taskmedia/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: artifact name
        run: echo "ARTIFACT_SUFFIX=${{ matrix.image }}-${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only; the merge job below attaches the tags to the
      # multi-arch manifest. Provenance and SBOM attestations stay off: they
      # add an index per platform image, which the manifest merge would nest.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.release-please.outputs.version }}
            COMMIT=${{ github.sha }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ env.ARTIFACT_SUFFIX }}
          cache-to: type=gha,scope=${{ env.ARTIFACT_SUFFIX }},mode=max

      - name: record digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.ARTIFACT_SUFFIX }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Opens the pull request that points the chart in taskmedia/helm at the new
  # release (docs/releasing.md). It waits for publish so the chart never names
  # an image tag that does not exist yet. Pre-releases get no chart.
  helm:
    name: helm chart pull request
    needs: [release-please, publish]
    if: >-
      needs.release-please.outputs.release_created == 'true'
      && !contains(needs.release-please.outputs.version, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      # The default GITHUB_TOKEN cannot write to another repository and does
      # not start the chart tests in the pull request, so there is no fallback.
      PAT: ${{ secrets.PAT }}
    steps:
      - name: require the PAT
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::secret PAT is missing: the helm chart pull request needs it"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/checkout@v4
        with:
          repository: taskmedia/helm
          token: ${{ secrets.PAT }}
          path: helm

      - name: bump the chart
        run: scripts/helm-bump-chart.sh helm/charts/outprint "$VERSION"

      - id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT }}
          path: helm
          branch: chore/outprint-${{ needs.release-please.outputs.version }}
          base: main
          commit-message: "chore(outprint): bump outprint to ${{ needs.release-please.outputs.version }}"
          title: "chore(outprint): bump outprint to ${{ needs.release-please.outputs.version }}"
          body: |
            Points the chart at the Outprint release
            [${{ needs.release-please.outputs.tag_name }}](https://github.com/${{ github.repository }}/releases/tag/${{ needs.release-please.outputs.tag_name }}).

            Opened by `.github/workflows/release-please.yml` in ${{ github.repository }}.
            Only the version is bumped. Chart changes that this release needs
            (new values, templates) are a separate pull request.

      # Off until the repository variable HELM_AUTO_MERGE is "true". GitHub only
      # waits for checks that are required on the helm repository's main; without
      # a required check this would merge at once.
      - name: auto-merge once the chart tests pass
        if: vars.HELM_AUTO_MERGE == 'true' && steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          GH_REPO: taskmedia/helm
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash

  publish:
    name: publish ${{ matrix.image }}
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [outprint, outprint-injector]
    env:
      REGISTRY_IMAGE: ghcr.io/taskmedia/${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          # '-linux-' so 'outprint' does not also match the 'outprint-injector' artifacts
          pattern: digests-${{ matrix.image }}-linux-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # X.Y.Z always; X.Y and latest only for a final release, so a pre-release
      # never moves them.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }},enable=${{ !contains(needs.release-please.outputs.version, '-') }}
            type=raw,value=latest,enable=${{ !contains(needs.release-please.outputs.version, '-') }}

      - name: create the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY_IMAGE}@sha256:%s " *)

      - name: inspect the result
        run: docker buildx imagetools inspect "${REGISTRY_IMAGE}:${{ steps.meta.outputs.version }}"
