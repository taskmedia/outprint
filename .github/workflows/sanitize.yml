name: sanitize

# Branch pushes are covered by the pull request run; only main runs on push.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: sanitize-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.21.2

      - name: Test the sanitize gate
        run: task test-sanitize test-audit

      # The private denylist is an Actions secret. Secrets are not available to
      # fork pull requests, so those runs only perform the generic checks.
      - name: Sanitize (generic and private denylist)
        env:
          PRIVATE_DENYLIST: ${{ secrets.SANITIZE_DENYLIST }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          if [ "$IS_FORK" != "true" ] && [ -n "$PRIVATE_DENYLIST" ]; then
            install -m 600 /dev/null "$RUNNER_TEMP/denylist.txt"
            printf '%s\n' "$PRIVATE_DENYLIST" > "$RUNNER_TEMP/denylist.txt"
            export SANITIZE_DENYLIST="$RUNNER_TEMP/denylist.txt"
          fi
          task sanitize
