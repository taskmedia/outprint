name: screenshots

# Visual check of the documentation screenshots (docs/internals/development.md).
# Regenerates them from the seeded dev stack and compares them with the
# committed PNGs in docs/assets/screens. Informational, never a required check:
# the committed images come from a developer machine, so fonts and rendering
# may differ slightly on the runner. The changed images are uploaded as an
# artifact and listed in the job summary; the job never fails the pull request.
on:
  pull_request:
    paths:
      - cmd/outprint-injector/**
      - internal/inject/**
      - internal/devseed/**
      - web/**
      - deploy/dev/**
      - e2e/screenshots/**
      - e2e/playwright.screenshots.config.ts
      - e2e/package-lock.json
      - docs/assets/screens/**
      - .github/workflows/screenshots.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: documentation screenshots (visual check)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # The example letter is the first page of a PDF, converted by pdftoppm.
      - name: install poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: install the browser
        run: cd e2e && npm ci && npx playwright install --with-deps chromium

      - name: start the dev stack
        run: task dev:up
        env:
          CI: "true"

      - name: regenerate the screenshots
        run: task screenshots
        env:
          CI: "true"

      # The optimise step keeps a committed PNG whose pixels are unchanged,
      # so git sees only the screenshots that really differ.
      - name: compare with the committed screenshots
        id: compare
        run: |
          set -euo pipefail
          changed="$(git status --porcelain -- docs/assets/screens | awk '{print $2}')"
          mkdir -p screenshot-diff
          {
            echo "## Documentation screenshots"
            if [ -z "$changed" ]; then
              echo "All screenshots match the committed images."
            else
              echo "These screenshots differ from the committed images. Review them in the \`screenshots-changed\` artifact."
              echo "If the change is intended, run \`task screenshots\` locally and commit the result. Rendering differences between a developer machine and the runner (fonts) can also show up here."
              echo
              echo '```'
              echo "$changed"
              echo '```'
              echo "changed=true" >> "$GITHUB_OUTPUT"
              while IFS= read -r file; do cp "$file" screenshot-diff/; done <<< "$changed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload the changed screenshots
        if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-changed
          path: screenshot-diff
          retention-days: 14

      - name: upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-failure
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: warn
          retention-days: 14
