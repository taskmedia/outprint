name: docker layer cache
description: >
  Sets up buildx and points the Taskfile docker builds at the GitHub Actions
  layer cache, so the TeX image layers are built once and reused across jobs
  and runs.

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # buildx reads the cache credentials from the environment; run steps do
    # not see them unless they are exported.
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: build through the layer cache
      shell: bash
      run: |
        echo "DOCKER_BUILD=docker buildx build --load --cache-from type=gha,scope=outprint --cache-to type=gha,mode=max,scope=outprint" >> "$GITHUB_ENV"
